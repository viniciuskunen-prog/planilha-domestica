name: Keep Supabase awake

on:
  schedule:
    - cron: '17 11,23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase heartbeat RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          response=$(curl --fail --silent --show-error --request POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')

          echo "$response"

          if ! printf '%s' "$response" | grep -q '"ping_count"'; then
            echo "Heartbeat response did not confirm a database write."
            exit 1
          fi

          echo "Supabase heartbeat write confirmed."
