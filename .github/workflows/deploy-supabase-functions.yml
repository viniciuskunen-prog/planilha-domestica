name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: fuxussjqzmfmowbvvuiy
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify function is reachable
        run: |
          code=$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/dashboard-domestic-sync")
          echo "HTTP ${code}"
          cat /tmp/response.json || true
          test "$code" = "401"
